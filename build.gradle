plugins {
    id 'base'
    id 'dev.railroadide.quality' version '1.0.0' apply false
    id 'net.fabricmc.fabric-loom' version '1.18.4' apply false
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

allprojects {
    group = mod_group
    version = mod_version

    repositories {
        mavenLocal {
            content {
                excludeGroup(turtymultiloader_group)
            }
        }
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven {
            url = 'https://dl.cloudsmith.io/public/turtywurty/turtymultiloader/maven/'
            content {
                includeGroup(turtymultiloader_group)
                includeGroup('dev.turtywurty')
            }
        }
        maven { url = 'https://maven.ladysnake.org/releases' }
    }
}

tasks.named('assemble') {
    dependsOn(':common:assemble', ':fabric:assemble', ':neoforge:assemble')
}

tasks.named('check') {
    dependsOn(':common:check', ':fabric:check', ':neoforge:check')
}
