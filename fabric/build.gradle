plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    accessWidenerPath.set(file("src/main/resources/${mod_id}.accesswidener"))

    runs {
        client {
            client()
            setConfigName('Industria Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Industria Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        dataGeneration {
            client()
            setConfigName('Industria Fabric Data Generation')
            ideConfigGenerated(true)
            runDir('runs/datagen')
            property('fabric-api.datagen', 'true')
            property('fabric-api.datagen.modid', mod_id)
            property('fabric-api.datagen.output-dir', file('src/main/generated').absolutePath)
        }
    }
}

sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.resources.srcDirs(
    '../common/src/main/resources',
    '../common/src/generated/resources',
    'src/main/generated'
)

def library = { String artifact ->
    "${turtymultiloader_group}:${artifact}-${minecraft_version}:${turtymultiloader_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Core multiloader bridge is available immediately. Optional replacement modules are added as their legacy APIs
    // are removed from Industria, avoiding duplicate gas/slurry/multiblock classes during the transition.
    implementation library('turtymultiloader-fabric')
    include library('turtymultiloader-fabric')

    include api("teamreborn:energy:${energy_api_version}")
    include api("dev.turtywurty:heatapi:${heat_api_version}")
    include api("dev.turtywurty:slurryapi:${slurry_api_version}")
    include api("dev.turtywurty:gasapi:${gas_api_version}")
    include api("dev.turtywurty:multiblocklib:${multiblock_lib_version}")

    implementation "org.jbox2d:jbox2d-library:${jbox2d_version}"
}

processResources {
    def properties = [version: project.version]
    inputs.properties(properties)
    filesMatching('fabric.mod.json') {
        expand(properties)
    }
}

tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}
