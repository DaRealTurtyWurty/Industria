modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/DaRealTurtyWurty/Industria/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/DaRealTurtyWurty/Industria"
authors = "${mod_author}"
description = '''${mod_description}'''

[[mixins]]
config = "industria.mixins.json"

[[mixins]]
config = "industria.client.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "turtymultiloader"
type = "required"
versionRange = "[${turtymultiloader_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "multiblocklib"
type = "required"
versionRange = "[${turtymultiloader_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "gasapi"
type = "required"
versionRange = "[${turtymultiloader_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "slurryapi"
type = "required"
versionRange = "[${turtymultiloader_version},)"
ordering = "AFTER"
side = "BOTH"
