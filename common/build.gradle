plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-common-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

neoForge {
    neoFormVersion = neo_form_version

    def accessTransformer = rootProject.file('neoforge/src/main/resources/META-INF/accesstransformer.cfg')
    if (accessTransformer.exists())
        accessTransformers.from(accessTransformer.absolutePath)
}

def library = { String artifact ->
    "${turtymultiloader_group}:${artifact}:${turtymultiloader_version}"
}

dependencies {
    compileOnly "net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    compileOnly library('turtymultiloader-common')
    compileOnly library('turtymultiloader-gas-common')
    compileOnly library('turtymultiloader-multiblock-common')
    compileOnly library('turtymultiloader-slurry-common')

    implementation "org.jbox2d:jbox2d-library:${jbox2d_version}"
}

sourceSets {
    main.resources.srcDir('src/generated/resources')

    client {
        java.srcDir('src/client/java')
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

java {
    registerFeature('client') {
        usingSourceSet(sourceSets.client)
    }
}

// Expose the common source directories as explicit variants. Loader projects
// compile these sources into their own mapped output while this project remains
// their sole IntelliJ source-root owner.
configurations {
    clientApi.extendsFrom(api)
    clientImplementation.extendsFrom(implementation)
    clientCompileOnly.extendsFrom(compileOnly)
    clientRuntimeOnly.extendsFrom(runtimeOnly)
    clientAnnotationProcessor.extendsFrom(annotationProcessor)

    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonClientJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    add('commonJava', file('src/main/java'))
    add('commonClientJava', file('src/client/java'))
    add('commonResources', file('src/main/resources'))
    add('commonResources', file('src/generated/resources'))
}
